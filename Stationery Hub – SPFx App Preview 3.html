<style>

:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1220;--card:#181c2e;--ink:#e8eaf3;--mut:#a1a8c0;--line:#2a2f47;--pri:#818cf8;--pri2:#a5b4fc;--side:#0a0c18;--sideink:#a5b4fc;--soft:#222850}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
.shell{display:flex;min-height:100%}
.side{transition:width .2s;width:232px;background:var(--side);color:var(--sideink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;flex:none}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:16px;padding:4px 10px 18px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center}
.nav{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:9px;cursor:pointer;color:var(--sideink);border:0;background:none;font:inherit;text-align:left;min-height:44px}
.nav:hover{background:rgba(255,255,255,.08)}.nav.on{background:var(--pri);color:#fff}
.nav svg,.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{font-size:12px;color:var(--mut)}.who{display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:600}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px;max-width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri2);outline-offset:1px}
.page{padding:24px;display:flex;flex-direction:column;gap:18px;max-width:1280px;width:100%}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:260px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(20,20,60,.04)}
.kpi{flex:1;min-width:170px;position:relative;overflow:hidden}.kpi b{display:block;font-size:28px;margin-top:4px}
.kpi i{position:absolute;right:-14px;top:-14px;width:70px;height:70px;border-radius:50%;opacity:.18}
.mut{color:var(--mut);font-size:12px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.1)}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.d{background:var(--bad)}.btn.s{min-height:34px;padding:6px 12px}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;color:#fff;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 16px;border:0;background:none;color:var(--mut);font:inherit;cursor:pointer;border-bottom:2px solid transparent;min-height:44px;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri);font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mut);text-align:left;font-weight:600}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tbody tr.cl{cursor:pointer}tbody tr.cl:hover{background:var(--soft)}
.bar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--pri),#a855f7)}
.cols{display:flex;align-items:flex-end;gap:16px;height:150px}.cols div{flex:1;text-align:center}.cols span{display:block;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#a855f7,var(--pri))}
.tl{display:flex;flex-direction:column;gap:0}.st{display:flex;gap:12px}.dot{width:14px;height:14px;border-radius:50%;margin-top:4px;flex:none;border:2px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.ln{width:2px;background:var(--line);margin:0 6px 0 -19px;flex:none}.st>div:last-child{padding-bottom:16px}
.lab{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.fld{flex:1;min-width:150px}
.ov{position:fixed;inset:0;background:rgba(10,10,30,.55);display:grid;place-items:center;padding:16px;z-index:50}.mo{background:var(--card);border-radius:14px;padding:22px;width:min(520px,100%);max-height:90%;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;z-index:60}
@media(max-width:820px){.page,.top{padding:14px}}
.side{position:sticky;top:0;height:100vh;align-self:flex-start;display:flex;flex-direction:column}.side.col{width:68px}.side.col .lb,.side.col .sec,.side.col .un,.side.col .brand span{display:none}.side.col .nav{justify-content:center}
.side{background:linear-gradient(180deg,#1e1b4b,#0f0d2e);overflow:hidden}
.sec{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#a5b4fc;padding:14px 12px 6px}
.nav.on{background:linear-gradient(90deg,#4338ca,#6366f1);box-shadow:0 4px 12px rgba(67,56,202,.45)}
.nav{position:relative}.nav .lb{flex:1}
.bd{background:#f59e0b;color:#1f2433;border-radius:10px;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;text-align:center}
.side.col .bd{position:absolute;top:3px;right:6px}
.tg{border:0;background:rgba(255,255,255,.1);color:#c7d2fe;border-radius:8px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;flex:none}
.hd{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}.side.col .hd{justify-content:center}.side.col .brand{display:none}
.us{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.08)}
.side.col .us{justify-content:center}
.us .av2{width:36px;height:36px;border-radius:50%;background:#6366f1;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
</style>
</head>

'<div class="card"><h2>Items</h2><div class="tw"><table><thead><tr><th>#</th><th>Item</th><th>Unit</th><th>Rate</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody>'+S.lines.map(function(l,x){var it=M.items[l.i];return '<tr><td>'+(x+1)+'</td><td><select aria-label="Item" onchange="S.lines['+x+'].i=+this.value;render()">'+M.items.map(function(o,k){return '<option value="'+k+'"'+(k===l.i?' selected':'')+'>'+o.code+' – '+o.name+'</option>'}).join('')+'</select></td><td>'+it.unit+'</td><td>'+fm(it.rate)+'</td><td><input type="number" min="1" aria-label="Quantity" value="'+l.q+'" style="width:84px" onchange="S.lines['+x+'].q=Math.max(1,+this.value||1);render()"></td><td><b>'+fm(it.rate*l.q)+'</b></td><td><button class="btn g s" aria-label="Remove row" onclick="S.lines.splice('+x+',1);if(!S.lines.length)S.lines=[{i:0,q:1}];render()">✕</button></td></tr>'}).join('')+'</tbody></table></div>'+
'<div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn g" onclick="S.lines.push({i:0,q:1});render()">+ Add item</button><div style="font-size:18px">Grand total <b>'+fm(g)+'</b></div></div></div>'+
'<div class="row"><button class="btn g" onclick="saveReq(false)">Save as draft</button><button class="btn" onclick="saveReq(true)">Submit for approval</button><button class="btn g" onclick="go(\'list\')">Cancel</button></div>'}
function saveReq(sub){var id=R.length?Math.max.apply(null,R.map(function(r){return r.id}))+1:1;
R.unshift({id:id,by:'Vishal',dept:'IT',date:'25 Oct 2026',status:sub?'InReview':'Draft',stage:sub?'RM':'Requestor',vendor:'',items:S.lines.map(function(l){var i=M.items[l.i];return {n:i.name,u:i.unit,r:i.rate,q:l.q}}),hist:sub?[L('Submit','Vishal','25 Oct')]:[]});
S.lines=[{i:0,q:1}];S.tab='mine';toast(sub?'Submitted to Reporting Manager':'Draft saved');go('detail',id)}
function det(){var r=cur(),x=S.role,no='STN-2026-'+('000'+r.id).slice(-5);
var fut=[];if(r.status==='InReview'){var k=CH.indexOf(r.stage);CH.slice(k).forEach(function(c){fut.push(SG[c]+' approval')});fut.push('HRAD processing')}else if(r.status==='HRApproval'){fut.push('HRAD vendor order')}
var tl=r.hist.map(function(h){return '<div class="st"><div class="dot" style="background:#15803d"></div><div><b>'+h.a+'</b><div class="mut">'+h.who+' · '+h.d+(h.c?'<br>“'+h.c+'”':'')+'</div></div></div>'}).join('')+fut.map(function(f,i){return '<div class="st"><div class="dot" style="background:'+(i?'var(--line)':'#2563eb')+'"></div><div><b style="color:var(--mut)">'+f+'</b><div class="mut">'+(i?'Upcoming':'Pending now')+'</div></div></div>'}).join('');
var act='';
if(r.status==='InReview'&&r.stage===x)act='<h2>Your decision · '+SG[x]+'</h2><textarea id="cm" rows="3" style="width:100%" placeholder="Comments (required for Reject or Amend)"></textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="decide(\'Approve\')">Approve</button><button class="btn g" onclick="decide(\'Amend\')">Ask to amend</button><button class="btn d" onclick="decide(\'Reject\')">Reject</button></div>';
else if(r.status==='HRApproval'&&x==='HRAD')act='<h2>HRAD processing</h2><div class="row"><div class="fld"><span class="lab">Vendor</span><select id="vn" style="width:100%">'+M.vendors.map(function(v){return '<option>'+v.name+'</option>'}).join('')+'</select></div></div><div class="row" style="margin-top:10px"><button class="btn" onclick="hrad(\'send\')">Send to vendor</button><button class="btn g" onclick="po()">Preview PDF</button></div>';
else if(r.status==='Ordered'&&x==='HRAD')act='<h2>Vendor order sent to '+r.vendor+'</h2><button class="btn" onclick="hrad(\'del\')">Mark delivered and hand over</button>';
else if(r.status==='Delivered'&&x==='Requestor'&&r.by==='Vishal')act='<h2>Verify received items</h2><div class="row"><button class="btn" onclick="fin(\'Closed\')">Confirm and close</button><button class="btn g" onclick="fin(\'PartialClosed\')">Partial close</button><button class="btn g" onclick="toast(\'Query emailed to HRAD\')">Raise query</button></div>';
else if(r.status==='AmendRequired'&&x==='Requestor')act='<h2>Amend requested</h2><button class="btn" onclick="resub()">Edit and resubmit</button>';
return '<div class="row" style="justify-content:space-between"><div class="row"><button class="btn g s" onclick="go(\'list\')">← Back</button><h1>'+no+'</h1>'+chip(r.status)+'</div><button class="btn g" onclick="po()">PDF</button></div>'+
'<div class="row" style="align-items:stretch"><div class="card grow" style="flex:2 1 420px"><div class="row mut" style="gap:24px;margin-bottom:12px"><span>Requestor: <b style="color:var(--ink)">'+r.by+'</b></span><span>Dept: <b style="color:var(--ink)">'+r.dept+'</b></span><span>Date: <b style="color:var(--ink)">'+r.date+'</b></span>'+(r.vendor?'<span>Vendor: <b style="color:var(--ink)">'+r.vendor+'</b></span>':'')+'</div><div class="tw"><table><thead><tr><th>Item</th><th>Unit</th><th>Rate</th><th>Qty</th><th>Total</th></tr></thead><tbody>'+r.items.map(function(i){return '<tr><td>'+i.n+'</td><td>'+i.u+'</td><td>'+fm(i.r)+'</td><td>'+i.q+'</td><td>'+fm(i.r*i.q)+'</td></tr>'}).join('')+'</tbody></table></div><div style="text-align:right;margin-top:12px;font-size:18px">Total <b>'+fm(tot(r))+'</b></div></div>'+
'<div class="card grow"><h2>History</h2><div class="tl">'+tl+'</div></div></div>'+(act?'<div class="card">'+act+'</div>':'')}
function decide(a){var r=cur(),c=($('#cm').value||'').trim();if(a!=='Approve'&&!c){toast('A comment is required');return}
r.hist.push({a:a==='Approve'?'Approve ('+SG[r.stage]+')':a,who:ROLES.filter(function(z){return z[0]===S.role})[0][1],d:'25 Oct',c:c});
if(a==='Approve'){var k=CH.indexOf(r.stage);if(k<2)r.stage=CH[k+1];else{r.status='HRApproval';r.stage='HRAD'}}else if(a==='Reject'){r.status='Rejected';r.stage=''}else{r.status='AmendRequired';r.stage='Requestor'}
toast(a+' recorded');render()}
function hrad(k){var r=cur();if(k==='send'){r.vendor=$('#vn').value;r.status='Ordered';r.hist.push(L('Vendor order sent','HRAD','25 Oct'));toast('PO emailed to '+r.vendor)}else{r.status='Delivered';r.stage='Requestor';r.hist.push(L('Delivered to HRAD, handed over','HRAD','25 Oct'));toast('Requestor notified')}render()}
function fin(s){var r=cur();r.status=s;r.stage='';r.hist.push(L(s==='Closed'?'Closed':'Partial close','Vishal','25 Oct'));toast('Request '+ST[s][0].toLowerCase());render()}
function resub(){var r=cur();r.status='InReview';r.stage='RM';r.hist.push(L('Resubmit','Vishal','25 Oct'));toast('Resubmitted');render()}
function po(){var r=cur();mo('<h2>Purchase order preview</h2><div class="card" style="background:#fff;color:#111"><b>PURCHASE ORDER · PO-STN-2026-'+('000'+r.id).slice(-5)+'</b><div style="font-size:12px;margin:6px 0">Vendor: '+(r.vendor||'(select vendor)')+'</div><table style="color:#111"><tbody>'+r.items.map(function(i){return '<tr><td>'+i.n+'</td><td>'+i.q+' '+i.u+'</td><td>'+fm(i.r*i.q)+'</td></tr>'}).join('')+'</tbody></table><b>Total '+fm(tot(r))+'</b></div><button class="btn" style="margin-top:12px" onclick="mo()">Close</button>')}
function adm(){var k=S.adm,c=COLS[k];
return '<div class="row" style="justify-content:space-between"><h1>Master data</h1><button class="btn" onclick="addM()">+ Add</button></div><div class="card"><div class="tabs">'+[['items','Items'],['vendors','Vendors'],['depts','Departments'],['emps','Employees']].map(function(t){return '<button class="tab'+(k===t[0]?' on':'')+'" onclick="S.adm=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join('')+'</div><div class="tw"><table><thead><tr>'+c.map(function(x){return '<th>'+x+'</th>'}).join('')+'<th>Active</th></tr></thead><tbody>'+M[k].map(function(r,i){return '<tr>'+c.map(function(x){return '<td>'+r[x]+'</td>'}).join('')+'<td><input type="checkbox" aria-label="Active" checked></td></tr>'}).join('')+'</tbody></table></div></div>'}
function addM(){var k=S.adm;mo('<h2>Add to '+k+'</h2>'+COLS[k].map(function(x){return '<span class="lab">'+x+'</span><input id="f_'+x+'" style="width:100%;margin-bottom:8px">'}).join('')+'<div class="row"><button class="btn" onclick="saveM()">Save</button><button class="btn g" onclick="mo()">Cancel</button></div>')}
function saveM(){var k=S.adm,o={};COLS[k].forEach(function(x){var v=$('#f_'+x).value;o[x]=(x==='rate'||x==='stock')?+v||0:v||'–'});M[k].push(o);mo();toast('Saved');render()}
function render(){shell();var v={dash:dash,list:list,new:frm,detail:det,admin:adm}[S.route]||dash;$('#app').innerHTML=v();var q=$('#q');if(q&&document.activeElement===document.body&&S.q){q.focus();q.setSelectionRange(S.q.length,S.q.length)}}
var h=(location.hash||'').slice(1);if(['dash','list','new','admin'].indexOf(h)>-1)S.route=h;
window.addEventListener('hashchange',function(){var n=location.hash.slice(1);if(['dash','list','new','admin'].indexOf(n)>-1&&n!==S.route){S.route=n;render()}});
render();
</script>
</body>
</html>
